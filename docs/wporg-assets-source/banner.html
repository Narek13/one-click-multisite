<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:772px;height:250px;overflow:hidden}
body{background:linear-gradient(160deg,#6a4fe0 0%,#3a2796 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff;position:relative}
.grid{position:absolute;right:-30px;top:-20px;width:300px;height:300px;opacity:.13}
.grid i{position:absolute;width:46px;height:46px;border-radius:11px;background:#fff}
.icon{position:absolute;left:44px;top:50px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.text{position:absolute;left:228px;top:50px;right:24px}
h1{margin:0;font-size:52px;line-height:1;font-weight:800;letter-spacing:-1px}
.sub{margin:12px 0 0;font-size:24px;font-weight:400;color:#e3dcff}
.chips{margin:20px 0 0;font-size:17px;font-weight:600;color:#6ee7a8;letter-spacing:.2px}
.chips span{margin:0 8px;color:#b8acf5}
</style></head><body>
<div class="grid">
 <i style="left:40px;top:40px"></i><i style="left:120px;top:40px"></i><i style="left:200px;top:40px"></i>
 <i style="left:80px;top:120px"></i><i style="left:160px;top:120px"></i><i style="left:240px;top:120px"></i>
 <i style="left:120px;top:200px"></i><i style="left:200px;top:200px"></i>
</div>
<div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="150" height="150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4fe0"/>
      <stop offset="1" stop-color="#3a2796"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Network links from the main site to the new sites -->
  <g stroke="#c9bfff" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="128" x2="62" y2="62"/>
    <line x1="128" y1="128" x2="194" y2="62"/>
    <line x1="128" y1="128" x2="62" y2="194"/>
  </g>

  <!-- New sites in the network -->
  <rect x="36" y="36" width="52" height="52" rx="12" fill="#ffffff"/>
  <rect x="168" y="36" width="52" height="52" rx="12" fill="#ffffff"/>
  <rect x="36" y="168" width="52" height="52" rx="12" fill="#ffffff"/>
  <rect x="46" y="48" width="32" height="6" rx="3" fill="#6a4fe0"/>
  <rect x="178" y="48" width="32" height="6" rx="3" fill="#6a4fe0"/>
  <rect x="46" y="180" width="32" height="6" rx="3" fill="#6a4fe0"/>

  <!-- The original site, now the main site -->
  <rect x="90" y="90" width="76" height="76" rx="14" fill="#ffffff"/>
  <rect x="90" y="90" width="76" height="20" rx="10" fill="#e3dcff"/>
  <rect x="90" y="100" width="76" height="10" fill="#e3dcff"/>
  <rect x="102" y="122" width="52" height="8" rx="4" fill="#3a2796"/>
  <rect x="102" y="138" width="36" height="8" rx="4" fill="#a99af0"/>

  <!-- One click -->
  <circle cx="194" cy="194" r="44" fill="#3a2796"/>
  <circle cx="194" cy="194" r="37" fill="#1fbf75"/>
  <path d="M 182 172 L 182 214 L 192 204 L 199 219 L 207 215 L 200 201 L 213 200 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
</svg></div>
<div class="text">
 <h1>One Click Multisite</h1>
 <p class="sub">Turn one WordPress site into a network.</p>
 <p class="chips">No wp-config edits<span>·</span>No .htaccess edits<span>·</span>Core installer</p>
</div>
</body></html>
