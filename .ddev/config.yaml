name: one-click-multisite
type: wordpress
docroot: .ddev/wordpress
php_version: "8.1"
nodejs_version: "22"
# Apache, not nginx: the plugin writes multisite rewrite rules to .htaccess,
# so the dev site must actually read them.
webserver_type: apache-fpm
xdebug_enabled: false
database:
    type: mariadb
    version: "11.8"
use_dns_when_possible: true
composer_version: "2"
hooks:
    post-start:
        - exec: .ddev/commands/setup.sh
web_environment:
    - WP_TITLE=One Click Multisite
    - ADMIN_USER=admin
    - ADMIN_PASS=admin
upload_dirs:
    - wp-content/uploads
